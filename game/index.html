<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberlight — a firefly's last night</title>
<meta name="description" content="Emberlight: guide a firefly through a night garden, gather 18 embers before dawn, and vent your glow before the shadow moths find you.">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #02060c;
  }
  body {
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    aspect-ratio: 16 / 9;
    background: #040811;
    outline: none;
    box-shadow: 0 0 120px rgba(255, 180, 70, 0.06);
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0" aria-label="Emberlight. Fly a firefly with WASD or the arrow keys, gather 18 embers before the night ends, and press Space to vent your glow and scatter the shadow moths. Enter starts the night and restarts after it ends; P pauses."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
